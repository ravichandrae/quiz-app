apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quiz.fullname" . }}-web
  labels:
    {{- include "quiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "quiz.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "quiz.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "quiz.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "quiz.image" (list . .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://{{ include "quiz.fullname" . }}-backend:8080
            - name: TRUSTED_PROXY_CIDR
              value: {{ .Values.web.trustedProxyCidr | quote }}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "quiz.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # nginx writes its rendered config and temporary files here.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quiz.fullname" . }}-web
  labels:
    {{- include "quiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "quiz.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quiz.fullname" . }}
  labels:
    {{- include "quiz.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The web pods serve the app and pass /api/ on to the backend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quiz.fullname" . }}-web
                port:
                  name: http
{{- end }}

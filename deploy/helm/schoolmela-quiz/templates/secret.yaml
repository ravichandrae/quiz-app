{{- if not .Values.secrets.existingSecret }}
{{- $jwt := required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 32 }}{{ fail "secrets.jwtSecret must be at least 32 characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quiz.secretName" . }}
  labels:
    {{- include "quiz.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword is required (or set secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  BOOTSTRAP_ADMIN_NAME: {{ .Values.secrets.bootstrapAdmin.name | quote }}
  BOOTSTRAP_ADMIN_MOBILE: {{ .Values.secrets.bootstrapAdmin.mobile | quote }}
  BOOTSTRAP_ADMIN_PIN: {{ .Values.secrets.bootstrapAdmin.pin | quote }}
{{- end }}

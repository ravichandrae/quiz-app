spring:
  application:
    name: quiz-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quiz}
    username: ${DB_USERNAME:quiz}
    password: ${DB_PASSWORD:quiz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  # Tomcat takes the client address from X-Forwarded-For, but only when the request comes from a
  # proxy on a private network. nginx in front sets that header to the one real client address.
  forward-headers-strategy: native
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  auth:
    # Required: at least 32 characters. Keep it secret; changing it logs everyone out.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-failed-logins: 5
    lockout-duration: 15m
  rate-limit:
    # Login/register/refresh requests per client network address per minute. A class often shares
    # one school address, so keep this generous; wrong PINs are also limited per account.
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:120}
  quiz:
    # Extra time after a question's deadline in which an answer still counts (slow networks).
    answer-grace: 3s
  reports:
    # Time zone for dates and times in exported CSV files.
    time-zone: Asia/Kolkata
  bootstrap-admin:
    name: ${BOOTSTRAP_ADMIN_NAME:Admin}
    mobile: ${BOOTSTRAP_ADMIN_MOBILE:}
    pin: ${BOOTSTRAP_ADMIN_PIN:}
